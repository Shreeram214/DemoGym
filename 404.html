<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | IronPulse Fitness</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f6f7f4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,800;1,800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <script>
    /* Same theme as the main site: the visitor's saved choice, else light */
    (function () {
      var t;
      try { t = localStorage.getItem("ironpulse-theme"); } catch (e) {}
      if (t !== "dark") t = "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <!-- Styles are inline so this page works at any URL depth -->
  <style>
    :root {
      --bg: #0a0a0a; --surface: #151515; --border: rgba(255, 255, 255, 0.12);
      --text: #f4f4f4; --text-muted: #a8a8a8;
      --accent: #b6ff2e; --accent-text: #b6ff2e; --accent-ink: #0a0a0a;
    }
    :root[data-theme="light"] {
      --bg: #f6f7f4; --surface: #ffffff; --border: rgba(0, 0, 0, 0.1);
      --text: #111311; --text-muted: #4a4f4a;
      --accent-text: #3f7a00;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center;
      padding: 2rem 1rem;
      background: var(--bg); color: var(--text);
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.6; text-align: center;
    }
    main { max-width: 520px; }
    .logo { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--accent-text); text-decoration: none; }
    .logo svg { width: 40px; height: 40px; }
    .logo span {
      font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
      font-weight: 800; font-size: 1.6rem; letter-spacing: 0.02em; color: var(--text);
    }
    .logo span b { color: var(--accent-text); font-weight: 800; }
    .code {
      margin: 2rem 0 0.25rem;
      font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
      font-weight: 800; font-style: italic;
      font-size: clamp(6rem, 30vw, 10rem); line-height: 0.85;
      color: var(--accent-text);
    }
    h1 {
      margin: 0 0 0.75rem;
      font-family: "Barlow Condensed", "Arial Narrow", Impact, sans-serif;
      font-weight: 800; font-size: clamp(2rem, 8vw, 2.75rem); line-height: 1; text-transform: uppercase;
    }
    p { margin: 0 0 2rem; color: var(--text-muted); }
    .btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.9rem 1.75rem; border-radius: 999px;
      background: var(--accent); color: var(--accent-ink);
      font-weight: 600; text-decoration: none;
      transition: transform 0.2s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:focus-visible, .logo:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <a class="logo home-link" href="/" aria-label="IronPulse Fitness home">
      <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="currentColor"><rect x="4" y="22" width="5" height="20" rx="2"/><rect x="11" y="16" width="6" height="32" rx="2"/><rect x="47" y="16" width="6" height="32" rx="2"/><rect x="55" y="22" width="5" height="20" rx="2"/><rect x="17" y="29" width="30" height="6" rx="2"/></g></svg>
      <span>IRON<b>PULSE</b></span>
    </a>
    <div class="code" aria-hidden="true">404</div>
    <h1>This page skipped leg day</h1>
    <p>The page you're looking for doesn't exist or has moved. Let's get you back to training.</p>
    <a class="btn home-link" href="/">Back to Home
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </main>
  <script>
    /* On GitHub Pages the site lives under /DemoGym/, not the domain root */
    (function () {
      var m = location.pathname.match(/^\/DemoGym(\/|$)/i);
      if (!m) return;
      var links = document.querySelectorAll(".home-link");
      for (var i = 0; i < links.length; i++) links[i].setAttribute("href", "/DemoGym/");
    })();
  </script>
</body>
</html>
